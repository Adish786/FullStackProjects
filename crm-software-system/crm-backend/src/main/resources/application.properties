spring.application.name=crm-backend
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/crm_db
spring.datasource.username=root
spring.datasource.password=password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Server Port
server.port=8080

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Use a longer secret key (at least 64 characters for HS512)
jwt.secret=mySuperSecureSecretKeyForJWTAuthenticationInCRMApplication2024ThatIsLongEnoughForHS512Algorithm
jwt.expiration=86400000

