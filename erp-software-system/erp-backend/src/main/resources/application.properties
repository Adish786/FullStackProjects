spring.application.name=erp-backend
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/erp_system
spring.datasource.username=root
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
#jwt.secret=erpSystemSecretKey2024
jwt.secret= 35f04ebf5ab6a4721406cb8cc09c7c7126fc3602b35dd9acb70f8f11c9c6c0ae
jwt.expiration=86400000

# Server
server.port=8080

spring.main.allow-bean-definition-overriding=true

spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true