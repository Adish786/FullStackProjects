spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_db
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: mySecretKeyForJWTGenerationInBookstoreManagementSystem2024
    expiration: 86400000 # 24 hours in milliseconds

server:
  port: 8080

logging:
  level:
    com.bookstore: DEBUG